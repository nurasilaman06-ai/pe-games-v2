<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дене шынықтыру ойындары — Модификация платформасы</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --card-2: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #070b14 0%, var(--bg) 45%, #0f172a 100%);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 64px;
    }

    .container { max-width: 1160px; margin: 0 auto; padding: 20px; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-bottom: 22px;
      backdrop-filter: blur(10px);
    }

    .brand h1 { font-size: 1.35rem; color: #fff; }
    .brand p { font-size: 0.9rem; color: var(--muted); }

    .lang-switch { display: flex; gap: 8px; }
    .lang-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #052e16;
      border-color: var(--accent);
    }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; margin-bottom: 22px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; margin-bottom: 24px; }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
    }

    h2 { font-size: 1.15rem; margin-bottom: 12px; color: var(--accent-2); }
    h3 { font-size: 1.05rem; margin-bottom: 8px; }

    label { display: block; font-size: 0.88rem; color: var(--muted); margin-bottom: 6px; }
    select, input, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-green { background: var(--accent); color: #052e16; }
    .btn-blue { background: var(--accent-2); color: #082f49; }
    .btn-warn { background: var(--warn); color: #271700; }
    .btn-red { background: var(--danger); color: #fff; }
    .btn-ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }

    .stats-box {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .stat {
      background: var(--card-2);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .stat .num { font-size: 1.25rem; font-weight: 800; color: var(--accent); }
    .stat .lbl { font-size: 0.8rem; color: var(--muted); }
